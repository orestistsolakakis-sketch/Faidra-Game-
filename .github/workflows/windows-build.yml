name: Build Windows Download

# Exports a native Windows build and publishes it as a downloadable zip on a
# GitHub Release. Native desktop rendering avoids all the browser/WebGL issues
# the web build hit on some GPUs.

on:
  push:
    branches:
      - claude/indie-adventure-game-28fpz7
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  windows:
    name: Export Windows build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      - name: Export Windows
        run: |
          mkdir -p build/windows
          # Import first so a fresh checkout has its resource cache.
          godot --headless --import . || true
          godot --headless --verbose --export-release "Windows Desktop" build/windows/Lumenfall.exe
          ls -la build/windows

      - name: Package
        run: |
          cd build/windows
          zip -r ../../Lumenfall-Windows.zip .
          cd ../..
          ls -la Lumenfall-Windows.zip

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: "Lumenfall — Windows build (latest)"
          files: Lumenfall-Windows.zip
          body: |
            Latest native Windows build of Lumenfall (Cinder Hollow).

            How to play:
            1. Download **Lumenfall-Windows.zip** below.
            2. Right-click it → Extract All.
            3. Run **Lumenfall.exe**. (Windows SmartScreen may warn about an
               unknown publisher — click "More info" → "Run anyway". It's unsigned,
               not unsafe.)
